---
layout: home
title: Fork & Trail
subtitle: "I write code, break things, then hike to clear my head. Professional problem solver, occasional problem creator — this blog is the evidence."
---

<!-- ── Search ── -->
<div class="home-search">
  <i class="fas fa-search home-search-icon"></i>
  <input id="post-search" type="text" placeholder="Search posts…" autocomplete="off">
</div>

<!-- ── Tag filter ── -->
<div id="tag-bar">
  <span class="tag-bar-label">Filter:</span>
</div>

<style>
/* ── Search ── */
.home-search {
  position: relative;
  margin-bottom: 1.5rem;
}
.home-search-icon {
  position: absolute;
  left: 0.9rem;
  top: 50%;
  transform: translateY(-50%);
  color: #aaa;
  font-size: 0.85rem;
}
#post-search {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.4rem;
  border: 1.5px solid #e0e0e0;
  border-radius: 25px;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
  background: #fafafa;
}
#post-search:focus {
  border-color: #0085A1;
  background: #fff;
}

/* ── Tag filter ── */
#tag-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  align-items: center;
  margin-bottom: 1.8rem;
}
.tag-bar-label {
  font-size: 0.84rem;
  font-weight: 600;
  color: #777;
  margin-right: 0.2rem;
}

/* ── Post list ── */
.posts-list .post-preview {
  border-bottom: 1px solid #f0f0f0;
  padding-bottom: 1.6rem;
  margin-bottom: 1.6rem;
}
.posts-list .post-preview:last-child { border-bottom: none; }

/* ── No-results ── */
#no-results {
  display: none;
  color: #999;
  font-style: italic;
  margin: 1rem 0 2rem;
}
</style>

<p id="no-results">No posts found.</p>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var posts     = Array.from(document.querySelectorAll('.post-preview'));
  var tagSet    = new Set();
  var activeTag = 'all';
  var searchQ   = '';

  posts.forEach(function (p) {
    p.querySelectorAll('.blog-tags a').forEach(function (a) {
      tagSet.add(a.textContent.trim());
    });
  });

  /* ── Build tag buttons ── */
  var bar = document.getElementById('tag-bar');

  function makeBtn(label, tag, active) {
    var b = document.createElement('button');
    b.textContent = label;
    b.dataset.tag = tag;
    b.className = 'btn btn-sm ' + (active ? 'btn-primary' : 'btn-outline-secondary');
    b.style.cssText = 'border-radius: 20px; font-size: 0.8rem;';
    return b;
  }

  bar.appendChild(makeBtn('All', 'all', true));
  Array.from(tagSet).sort().forEach(function (t) { bar.appendChild(makeBtn(t, t, false)); });

  bar.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tag]');
    if (!btn) return;
    activeTag = btn.dataset.tag;
    bar.querySelectorAll('button').forEach(function (b) {
      b.className = 'btn btn-sm btn-outline-secondary';
      b.style.cssText = 'border-radius: 20px; font-size: 0.8rem;';
    });
    btn.className = 'btn btn-sm btn-primary';
    btn.style.cssText = 'border-radius: 20px; font-size: 0.8rem;';
    applyFilters();
  });

  /* ── Search ── */
  document.getElementById('post-search').addEventListener('input', function () {
    searchQ = this.value.trim().toLowerCase();
    applyFilters();
  });

  /* ── Filter logic ── */
  function applyFilters() {
    var visible = 0;
    posts.forEach(function (p) {
      var title = (p.querySelector('.post-title') || p).textContent.toLowerCase();
      var tags  = Array.from(p.querySelectorAll('.blog-tags a')).map(function (a) { return a.textContent.trim(); });
      var matchTag    = activeTag === 'all' || tags.includes(activeTag);
      var matchSearch = !searchQ || title.includes(searchQ) || tags.some(function (t) { return t.toLowerCase().includes(searchQ); });
      var show = matchTag && matchSearch;
      p.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
  }
});
</script>
